# Configuration de l'application
spring.application.name=mirador-hotel-accounting-backend

# Configuration du serveur
server.port=8080

# Configuration MySQL
app.mysql.host=${MYSQL_HOST:localhost}
app.mysql.port=${MYSQL_PORT:3306}
app.mysql.database=${MYSQL_DATABASE:bd_mirador}
spring.datasource.url=jdbc:mysql://${app.mysql.host}:${app.mysql.port}/${app.mysql.database}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Lagos&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# Encodage Force UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Hibernate / JDBC Charset
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.sql.init.data-locations=classpath:data-seed-clean.sql
spring.jackson.serialization.write-dates-as-timestamps=false

# Configuration JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# Configuration CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5175

# Configuration de logging
logging.level.root=INFO
logging.level.com.mirador.hotel=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT defaults (change secret in production)
jwt.secret=change-me-please-set-a-secure-random-secret-1234567890abcdef
jwt.expiration-ms=86400000
