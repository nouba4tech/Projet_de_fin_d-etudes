# Full stack: MySQL + 11 microservices + API gateway + frontend.
# The gateway is named "backend" so anything that targeted the old monolith (backend:8080) keeps working.
#   cp .env.example .env   (then edit the secrets)   ;   docker compose up -d --build
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  utilisateurs-service:
    build:
      context: .
      args:
        MODULE: utilisateurs-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?define INTERNAL_TOKEN in .env}
      UTILISATEURS_URL: http://utilisateurs-service:8081
      CHAMBRES_URL: http://chambres-service:8082
      CLIENTS_URL: http://clients-service:8083
      RESERVATIONS_URL: http://reservations-service:8084
      PAIEMENTS_URL: http://paiements-service:8085
      FACTURATION_URL: http://facturation-service:8086
      PERSONNEL_URL: http://personnel-service:8087
      PROMOTIONS_URL: http://promotions-service:8088
      AVIS_URL: http://avis-service:8089
      NOTIFICATIONS_URL: http://notifications-service:8090
      EXPLOITATION_URL: http://exploitation-service:8091
    depends_on:
      db:
        condition: service_healthy

  chambres-service:
    build:
      context: .
      args:
        MODULE: chambres-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
