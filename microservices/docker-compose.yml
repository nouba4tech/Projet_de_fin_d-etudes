      CLIENTS_URL: http://clients-service:8083
      RESERVATIONS_URL: http://reservations-service:8084
      PAIEMENTS_URL: http://paiements-service:8085
      FACTURATION_URL: http://facturation-service:8086
      PERSONNEL_URL: http://personnel-service:8087
      PROMOTIONS_URL: http://promotions-service:8088
      AVIS_URL: http://avis-service:8089
      NOTIFICATIONS_URL: http://notifications-service:8090
