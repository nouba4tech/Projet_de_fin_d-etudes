# Shared defaults imported by every business microservice (spring.config.import=classpath:common.properties)

# --- MySQL (one schema per service, same server) ---
app.mysql.host=${MYSQL_HOST:localhost}
app.mysql.port=${MYSQL_PORT:3306}
spring.datasource.url=jdbc:mysql://${app.mysql.host}:${app.mysql.port}/${app.mysql.database}?createDatabaseIfNotExist=true&sslMode=${MYSQL_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=Africa/Lagos&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# --- schema bootstrap (idempotent CREATE TABLE IF NOT EXISTS) ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- encoding / json ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false

# --- security (same secret in every service so one JWT is valid everywhere) ---
jwt.secret=${JWT_SECRET:change-me-please-set-a-secure-random-secret-1234567890abcdef}
jwt.expiration-ms=86400000
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5175

# --- service-to-service ---
internal.token=${INTERNAL_TOKEN:mirador-internal-dev-token}
services.utilisateurs.url=${UTILISATEURS_URL:http://localhost:8081}
services.chambres.url=${CHAMBRES_URL:http://localhost:8082}
services.clients.url=${CLIENTS_URL:http://localhost:8083}
services.reservations.url=${RESERVATIONS_URL:http://localhost:8084}
services.paiements.url=${PAIEMENTS_URL:http://localhost:8085}
services.facturation.url=${FACTURATION_URL:http://localhost:8086}
services.personnel.url=${PERSONNEL_URL:http://localhost:8087}
services.promotions.url=${PROMOTIONS_URL:http://localhost:8088}
services.avis.url=${AVIS_URL:http://localhost:8089}
services.notifications.url=${NOTIFICATIONS_URL:http://localhost:8090}
services.exploitation.url=${EXPLOITATION_URL:http://localhost:8091}

# --- logging ---
logging.level.root=INFO
logging.level.com.mirador.hotel=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name:app}] - %msg%n
