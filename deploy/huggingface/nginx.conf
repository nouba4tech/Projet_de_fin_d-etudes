worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/logs/nginx-error.log warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 7860;
        root /app/web;
        index index.html;

        # API: same origin, forwarded to the gateway (started last)
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;
            client_max_body_size 10m;
            error_page 502 503 504 = @starting;
        }

        location @starting {
            default_type application/json;
            return 503 '{"message":"Application en cours de demarrage (environ 8 minutes apres un reveil), reessayez dans un instant."}';
        }

        # Single-page app
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
